<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MTH 202 - Mathematical Methods CBT Lab. Practice timed, topic-based tests with pause/resume, shuffled question bank, and full worked solutions." />
    <title>MaxPrep CBT Lab</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f7ff;color:#0f2040;font-family:system-ui,sans-serif">
        <div style="width:48px;height:48px;border:4px solid #d6e3ff;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:20px"></div>
        <p style="font-size:18px;font-weight:600;margin:0">MaxPrep CBT Lab</p>
        <p id="loading-sub" style="font-size:14px;color:#5b6d8e;margin-top:6px">Loading your test practice…</p>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      // Inline fallback: if JS is slow, update the message (doesn't depend on the bundle)
      setTimeout(function(){var s=document.getElementById('loading-sub');if(s)s.textContent='Still loading… please wait a moment.';},4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
